 <!DOCTYPE html>
 <html lang="fr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login avec Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
  <link rel="stylesheet" href="/assets/styles/signIn.css">

  <style>

  </style>
</head>
<body>
  <div class="container ">
    <div class="row justify-content-center align-items-center g-4 card-custom p-4 containers mt-3 rounded-3">

       <div class="col-md-6 text-center">
        <img src="/assets/images/signIn.png" alt="Illustration 3D" class="illustration img-fluid rounded-3">
      </div>

       <div class="col-md-6 text-center">
        <h3 class="mb-2 text-warning">Se connecter avec Google</h3>
 
        <div class="flex flex-column">
          <div id="g_id_signin" class="w-75 m-lg-auto inputs"></div>

         
            <form id="loginForm">
                <div class="mb-3">
                <label for="email" class="form-label text-white">Mail :</label>
                <input type="email" name="email" id="email" class="form-control w-75 m-lg-auto input bg-dark text-warning " placeholder="nom@gmail.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-white">Password :</label>
                <input type="password" name="password" id="password" class="form-control w-75 m-lg-auto input text-warning bg-dark"  required>
            </div>
                <button id="btn" type="submit" class="btn btn-primary w-50 m-lg-auto inputs">Se connecter</button>
            </div>
            </form>

          </div>
      </div>


    </div>
    
  </div>

   <script src="/assets/script/signIn.js"></script>
</body>
</html>
