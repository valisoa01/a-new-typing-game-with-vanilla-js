<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Login avec Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background: #f5f5f5;
    }
    #g_id_onload {
      display: none;
     }
  </style>
</head>
<body>
  <div class="container ">
    <div class="row justify-content-center align-items-center g-4 card-custom p-4 bg-secondary mt-3">

       <div class="col-md-6 text-center">
        <img src="/assets/images/signIn.png" alt="Illustration 3D" class="illustration img-fluid">
      </div>

       <div class="col-md-6 text-center">
        <h3 class="mb-2 text-warning">Se connecter avec Google</h3>
 
        <div class="flex flex-column">
          <div id="g_id_signin" class="w-75 m-lg-auto"></div>

         
            <form>
                <div class="mb-3">
                <label for="email" class="form-label text-secondary">Mail :</label>
                <input type="email" name="email" id="email" class="form-control w-75 m-lg-auto" placeholder="nom@gmail.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-secondary">Password :</label>
                <input type="password" name="password" id="password" class="form-control w-75 m-lg-auto"  required>
            </div>
            <div class="d-grid ">
                <button id="btn" type="submit" class="btn btn-primary w-50 m-lg-auto">Se connecter</button>
            </div>
            </form>

          </div>
      </div>


    </div>
    
  </div>

   <script src="/assets/script/signIn.js"></script>
</body>
</html>
