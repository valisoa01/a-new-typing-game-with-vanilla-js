<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTyper - Typing Speed Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="dark-mode">
    <header class="shadow-sm py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h1 class="fw-bold mb-0">SpeedTyper</h1>
                <span class="badge bg-primary">Beta</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <p class="lead mb-0 d-none d-md-block">Test your typing speed</p>
            </div>
            <div class="theme-switch-wrapper">
                <span id="toggle-icon">
                    <i class="fas fa-sun"></i>
                </span>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox">
                    <div class="slider round"></div>
                </label>
              </div>
        </div>
    </header>

    <div class="container my-5">
        <div class="card shadow-sm p-4 mb-4">
            <div class="d-flex justify-content-between flex-wrap mb-4 text-center gap-2">
                <div class="info-box bg-success text-white p-3 rounded flex-grow-1">
                    <i class="bi bi-clock"></i> Time: <span id="timer">60</span>s
                </div>
                <div class="info-box bg-primary text-white p-3 rounded flex-grow-1">
                    <i class="bi bi-speedometer2"></i> WPM: <span id="wpm">0</span>
                </div>
                <div class="info-box bg-warning text-dark p-3 rounded flex-grow-1">
                    <i class="bi bi-bullseye"></i> Accuracy: <span id="accuracy">0</span>%
                </div>
                <button id="restart-btn" class="btn btn-secondary flex-grow-1">
                    <i class="bi bi-arrow-repeat"></i> Restart
                </button>
            </div>

            <div id="text-display" class="p-3 rounded mb-3" style="min-height: 120px; background-color: var(--bg-tertiary); border: 1px solid var(--border-color);">
                Loading text...
            </div>

            <div class="position-relative">
                <textarea id="input-field" class="form-control p-3" rows="4" placeholder="Start typing here..." disabled
                    style="resize: none;"></textarea>
                    <br>
                <div id="start-overlay" class="overlay">
                    <button id="start-btn" class="btn btn-primary btn-lg px-4 ms-20">
                        <i class="bi bi-rocket"></i> Start Test
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center text-muted mb-4">
            <p class="mb-1">Press space after each word. The test ends when time runs out.</p>
            <small class="text-muted">Tip: Focus on accuracy first, speed will come naturally.</small>
        </div>

        <div id="result-popup" class="popup d-none">
            <div class="popup-content">
                <div class="mb-3">
                    <i class="bi bi-trophy" style="font-size: 3rem; color: var(--accent-color);"></i>
                </div>
                <h2 id="result-title" class="mb-2"></h2>
                <p id="result-message" class="mb-4"></p>
                <div class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
                    <button id="menu-btn" class="btn btn-outline-secondary">
                        <i class="bi bi-house"></i> Menu
                    </button>
                    <button id="restart-final" class="btn btn-primary">
                        <i class="bi bi-arrow-repeat"></i> Try Again
                    </button>
                    <button id="continue-btn" class="btn btn-success d-none">
                        <i class="bi bi-arrow-right"></i> Continue
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-3 mt-auto">
        <div class="container text-center text-muted">
            <small>© 2023 SpeedTyper | Made with <i class="bi bi-heart-fill text-danger"></i> by Typing Enthusiasts</small>
        </div>
    </footer>

    <script src="/assets/script/speed.js"></script>
</body>
</html>
