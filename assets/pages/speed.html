<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTyper - Typing Speed Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles/speed.css">
</head>
<body class="bg-light text-dark">
    <header class="bg-danger d-flex  justify-content-between p-3 align-items-center">
        <h1 class="fw-bold">SpeedTyper</h1>
        <p class="lead">Test your typing speed and accuracy</p>
     </header>

    <div class="container my-5">


        <div class="card shadow p-4" id="game-area">
            <div class="d-flex justify-content-between flex-wrap mb-4 text-center gap-2">
                <div class="info-box bg-success text-white p-3 rounded">
                    Time: <span id="timer">60</span>s
                </div>
                <div class="info-box bg-primary text-white p-3 rounded">
                    WPM: <span id="wpm">0</span>
                </div>
                <div class="info-box bg-warning text-dark p-3 rounded">
                    Accuracy: <span id="accuracy">0</span>%
                </div>
                <button id="restart-btn" class="btn btn-secondary">🔁 Restart</button>
            </div>

            <div id="text-display" class="bg-light border p-3 rounded text-wrap mb-3" style="min-height: 120px;">
                Loading text...
            </div>

            <div class="position-relative">
                <textarea 
                    id="input-field" 
                    class="form-control p-3" 
                    rows="4" 
                    placeholder="Start typing here..." 
                    disabled></textarea>
                <div id="start-overlay" class="overlay">
                    <button id="start-btn" class="btn btn-primary btn-lg">🚀 Start Typing Test</button>
                </div>
            </div>
        </div>

        <div class="text-center mt-3 text-muted">
            <p>Press space after each word. The test ends when time runs out.</p>
        </div>

        <div id="result-popup" class="popup d-none">
            <div class="popup-content">
                <h2 id="result-title"></h2>
                <p id="result-message"></p>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <button id="menu-btn" class="btn btn-outline-dark">🏠 Menu</button>
                    <button id="restart-final" class="btn btn-outline-primary">🔁 Rejouer</button>
                    <button id="continue-btn" class="btn btn-success d-none">➡️ Continuer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/script/speed.js"></script>
</body>
</html>
