<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTyper - Typing Speed Test</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Roboto Mono', monospace;
        }
        
        .cursor {
            position: relative;
        }
        
        .cursor::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 24px;
            background: #3b82f6;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .correct {
            color: #10b981;
        }
        
        .incorrect {
            color: #ef4444;
            text-decoration: underline;
        }
        
        .current {
            background-color: #e0f2fe;
        }
    </style>
</head>
<body class="bg-secondary">
    <div class="w-85 p-3 m-auto ">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">SpeedTyper</h1>
            <p class="text-gray-600">Test your typing speed and accuracy</p>
        </header>
        
        <div class="bg-dark p-4 text-light rounded-2 ">
            <div class="d-flex justify-content-between items-center mb-4">
                <div class="d-flex gap-5 text-warning">
                    <div class="bg-success text-white p-3 rounded-3">
                        <span class="text-light">Time:</span> <span id="timer">60</span>s
                    </div>
                    <div class="bg-success text-light p-3 rounded-3">
                        <span class="text-light">WPM:</span> <span id="wpm">0</span>
                    </div>
                    <div class="bg-secondary text-dark p-3 rounded-3">
                        <span class="text-dark">Accuracy:</span> <span id="accuracy">0</span>%
                    </div>
                </div>
                
                <button id="restart-btn" class="bg-secondary hover:bg-gray-200 text-body-tertiary p-2 rounded-3 transition">
                    Restart
                </button>
            </div>
            
            <div id="text-display" class="bg-secondary p-4 rounded-3 text-body-tertiary text-primary  h-auto overflow-y-auto mb-4">
                Loading text...
            </div>
            
            <div class="relative ">
                <textarea 
                    id="input-field" 
                    class="w-100 p-3 border border-secondary rounded-3 " 
                    rows="4" 
                    placeholder="Start typing here..." 
                    disabled
                ></textarea>
                <div id="start-overlay" class="position-absolute inset-0  bg-opacity-100 flex items-center justify-center rounded-lg text-dark">
                    <button id="start-btn" class="bg-primary hover:bg-secondary m-lg-5 mt-5 text-white px-6 py-3 rounded-3 text-dark  transition">
                        Start Typing Test
                    </button>
                </div>
            </div>
        </div>
        
        <div class="text-center text-light">
            <p>Press space after each word. Test ends when time runs out.</p>
        </div>
    </div>
    
    <script src="/assets/script/speed.js"></script>
</body>
</html>
