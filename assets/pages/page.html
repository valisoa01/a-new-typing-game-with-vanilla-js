<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caractère Typing</title>
  <link rel="stylesheet" href="/assets/styles/sentence.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
 />
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
     <header class="header">
    <h3 ><span>Vanilla</span>Typing</h3>
      <h1>Caractère typing</h1>
      <div class="theme-switch-wrapper">
        <span id="toggle-icon">
            <i class="fas fa-sun"></i>
        </span>
        <label class="theme-switch">
            <input type="checkbox" id="checkbox">
            <div class="slider round"></div>
        </label>
      </div>
   </header>
 

  <div class="stats">
    <div><span>Correct</span><p id="correct">0</p></div>
    <div><span>Faux</span><p id="wrong">0</p></div>
    <div><span>Accurence</span><p id="accuracy">0</p></div>
    <div><span>Rapide</span><p id="speed">0</p></div>
  </div>

  <div class="main">
    <div class="letter" id="current-letter">A</div>
    <input type="text" id="input" maxlength="1" autofocus />
  </div>

  <script src="/assets/script/sentence.js"></script>
  <script src="/assets/script/light_mode.js"></script>
</body>
</html>
