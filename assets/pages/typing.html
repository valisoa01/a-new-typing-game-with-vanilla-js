<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Dactylographie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles/typing.css">
</head>
<body>
    <header class="container-fluid bg-dark d-flex justify-content-between align-items-center text-white border-bottom border-warning">
        <h3 class="m-0"><span class="titre">Vanilla</span>Typing</h3>
        <h2>Bienvenue sur Vanilla Typing Phrase</h2>
        <div>
            <select class="select form-select d-inline-block w-auto ms-2 text-dark" name="levelSelect" id="levelSelect">
                <option disabled selected>Choisir le niveau</option>
                <option value="easy">Facile</option>
                <option value="medium">Moyen</option>
                <option value="hard">Difficile</option>
            </select>
        </div>
    </header>

    <main>
        <section class="container-fluid bg-light text-dark text-center py-3">
            <div class="row fw-bolder text-warning bg-dark p-3 rounded-3">
                <div class="col">Correct<br><span id="correct" class="text-success">0</span></div>
                <div class="col">Faux<br><span id="wrong" class="text-danger">0</span></div>
                <div class="col">Précision<br><span id="accuracy">0</span></div>
                <div class="col">Vitesse<br><span id="speed">0</span></div>
            </div>
        </section>

        <section>
            <p id="restart-btn" class="text-light rounded-3 border-0">
                Recommencer
            </p>
        </section>

        <section class="section-text">
            <div class="container text-center mt-5">
                <div id="phrase" class="fs-4 mb-4 text-dark"></div>
                <input id="input" type="text" class="form-control form-control-lg border-warning text-center" placeholder="Commencez à taper ici..." autofocus />
            </div>
        </section>

        <section>
            <div id="statistique">
                <table class="table table-success table-striped w-50 m-auto mt-5">
                    <tr class="table-secondary rounded-3">
                        <td class="table-dark text-white p-5 fs-3">Niveau</td>
                        <td class="table-success text-success p-5 fs-3">Correct</td>
                        <td class="table-danger text-danger p-5 fs-3">Faux</td>
                    </tr>
                    <tr>
                        <td class="table-dark p-5 fs-2" id="stat-level">-</td>
                        <td class="table-success p-5 fs-2" id="stat-correct">0</td>
                        <td class="table-danger p-5 fs-2" id="stat-wrong">0</td>
                    </tr>
                </table>

                <div class="text-center mt-4">
                    <button id="replayBtn" class="btn btn-warning btn-lg">Relancer le test</button>
                </div>
            </div>
        </section>
    </main>

    <script src="/assets/script/typing.js"></script>
</body>
</html>
