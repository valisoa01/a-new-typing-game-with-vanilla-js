<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot Vanilla Typing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles/typing.css">
  <style>

  </style>
</head>
<body class="bg-primary text-white">

  <div class="container-fluid bg-dark p-5 d-flex justify-content-between align-items-center text-white border-bottom border-warning">
    <h3 class="m-0"><span class="titre">Vanilla</span>Typing</h3>
    <div class="niveau p-3">
      <!-- <span>Niveau </span> -->
      <select class="form-select d-inline-block w-auto ms-2 text-dark" id="levelSelect">
        <option disabled selected>Choisir niveau</option>
        <option value="easy">Facile</option>
        <option value="medium">Moyenne</option>
        <option value="hard">Difficile</option>
      </select>
    </div>
  </div>

  <div class="container-fluid bg-light text-dark text-center py-3">
    <div class="row fw-bold">
      <div class="col">Correct<br><span id="correct" class="text-success">0</span></div>
      <div class="col">Faux<br><span id="wrong" class="text-danger">0</span></div>
      <div class="col">Accurence<br><span id="accuracy">0</span></div>
      <div class="col">Speed<br><span id="speed">0</span></div>
    </div>
  </div>

  <div class="container text-center mt-5">
    <div id="phrase" class="fs-4 mb-4"></div>
    <input id="input" type="text" class="form-control form-control-lg border-warning text-center" placeholder="Start Typing..." autofocus />
  </div>

  <script src="/assets/script/typing.js">
   
  </script>
</body>
</html>
