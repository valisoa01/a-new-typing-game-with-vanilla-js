<head >

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/styles/acceuil.css">
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="

</head>
<body >
    <nav id="navbar" class="shadow navbar navbar-expand-lg header" aria-label="Offcanvas navbar large" >
        <div class="container-fluid">
            <h3 class="m-0"><span class="titre">Vanilla</span>Typping</h3>
            <button class="navbar-toggler " type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar2" aria-controls="offcanvasNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar2" aria-labelledby="offcanvasNavbar2Label">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbar2Label">VanillaTyping</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 p-3">
                        <li class="nav-item">
                            <a class="nav nav-link fw-bold " aria-current="page" href="#">Accueil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-apropos" href="./assets/pages/apropos.html">A propos</a>
                        </li>
                    </ul>
                    <form class="d-flex mt-3 mt-lg-0">
 
                       <a href="./assets/pages/sign_in.html" class="btn btn-outline-primary m-3">Login</a> 
                       <a href="./assets/pages/sign_in.html" class="btn btn-warning m-3 ">Sign in</a>
                      </form>
                </div>
            </div>
            <div class="theme-switch-wrapper butt">
                <span id="themeToggle">
                    <i class="fas fa-sun"></i>
                </span>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox">
                    <div class="slider round"></div>
                </label>
        
            </div>
        </div>
    </nav>
    <main class="container mt-5 main-container">

        <h1 class="text-center">Bonjour et bienvenue sur notre application vanilla typing</h1>
        <div class="typing-container text-center" id="typing"></div>

        <div class="keyboard mt-4" id="keyboard">
             <div class="row mb-2">
                <div class="key" id="key-a">A</div>
                <div class="key" id="key-z">Z</div>
                <div class="key" id="key-e">E</div>
                <div class="key" id="key-r">R</div>
                <div class="key" id="key-t">T</div>
                <div class="key" id="key-y">Y</div>
                <div class="key" id="key-u">U</div>
                <div class="key" id="key-i">I</div>
                <div class="key" id="key-o">O</div>
                <div class="key" id="key-p">P</div>
            </div>
            <div class="row mb-2">
                <div class="key" id="key-q">Q</div>
                <div class="key" id="key-s">S</div>
                <div class="key" id="key-d">D</div>
                <div class="key" id="key-f">F</div>
                <div class="key" id="key-g">G</div>
                <div class="key" id="key-h">H</div>
                <div class="key" id="key-j">J</div>
                <div class="key" id="key-k">K</div>
                <div class="key" id="key-l">L</div>
                <div class="key" id="key-m">M</div>
            </div>
            <div class="row mb-2">
                <div class="key wide" id="key-shift">Shift</div>
                <div class="key" id="key-w">W</div>
                <div class="key" id="key-x">X</div>
                <div class="key" id="key-c">C</div>
                <div class="key" id="key-v">V</div>
                <div class="key" id="key-b">B</div>
                <div class="key" id="key-n">N</div>
                <div class="key wide" id="key-enter">Enter</div>
            </div>
            <div class="row">
                <div class="key space" id="key-space">Espace</div>
            </div>
        </div>
    </main>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/script/acceuil.js"></script>
    <script src="./assets/script/typing.js"></script>
    <script src="./assets/script/bulle.js"></script>

    </script>
</body>
</html>
