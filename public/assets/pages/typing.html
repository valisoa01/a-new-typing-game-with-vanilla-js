<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTyper - Typing Speed Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles/typing.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="shadow-sm p-2  sticky-top" >
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h1 class="fw-bold mb-0"><span class="text-warning">Vanilla</span>Typing</h1>
             </div>
            <div class="d-flex align-items-center gap-3">
                <p class="lead mb-0 d-none d-md-block">Test your typing speed</p>
            </div>
            <div >
            </div>
            <div class="theme-switch-wrapper">
                <span id="toggle-icon">
                    <i class="fas fa-sun"></i>
                </span>
                <label class="theme-switch">
                    <input type="checkbox" id="checkbox">
                    <div class="slider round"></div>
                </label>
               <a href="../../index.html"> <button class="btn btn-primary m-lg-4"><i class="fa-solid fa-right-from-bracket"></i></button></a>

            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center mb-4">
            <div class="col-lg-8  w-100">
                <div class="card shadow mb-3">
                    <div class="card-body">
                         <div class="d-flex justify-content-between">
                            <div class="d-flex flex-wrap justify-content-center gap-3 mb-2 text-dark">
                                <button onclick="setLevel('easy')" class="btn btn-level btn-outline-success">
                                    😎Facile
                                </button>
                                <button onclick="setLevel('medium')" class="btn btn-level btn-outline-warning">
                                    😉Moyen
                                </button>
                                <button onclick="setLevel('hard')" class="btn btn-level btn-outline-danger">
                                    😣Difficile
                                </button>
                            </div>
                            <div class="text-center mb-3">
                                <span class="badge bg-primary fs-5 px-4 py-2">
                                    <i class="fas fa-clock me-2"></i>
                                    <span id="timer">60s</span>
                                </span>
                            </div>
                        </div>
                        
                 

                         <div class="row g-3 mt-3 ">
                            <div class="col-md-3 col-6 shadow-lg">
                                <div class="stats-card card h-100 text-center py-3 types">
                                    <div class="card-body ">
                                        <div class="d-flex justify-content-center mb-2 ">
                                            <div class="position-relative " >
                                                <svg class="progress-ring" width="60" height="60" viewBox="0 0 36 36">
                                                    <circle class="progress-ring__circle" stroke="var(--secondary-color)" stroke-width="3" fill="transparent" r="16" cx="18" cy="18"></circle>
                                                    <circle class="progress-ring__circle" stroke="var(--primary-color)" stroke-width="3" stroke-dasharray="100 100" fill="transparent" r="16" cx="18" cy="18"></circle>
                                                </svg>
                                                <span id="accuracy" class="position-absolute top-50 start-50 translate-middle fw-bold">0%</span>
                                            </div>
                                        </div>
                                        <h6 class="card-subtitle mb-0">Accurrence</h6>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6 shadow-lg">
                                <div class="stats-card card h-100 text-center py-3 types">
                                    <div class="card-body">
                                        <h3 class="card-title mb-2"><span id="wpm">0</span></h3>
                                        <h6 class="card-subtitle mb-0">WPM</h6>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6 shadow-lg">
                                <div class="stats-card card h-100 text-center py-3 types">
                                    <div class="card-body">
                                        <h3 class="card-title mb-2"><span id="correct-count">0</span></h3>
                                        <h6 class="card-subtitle mb-0">Correcte</h6>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6 ">
                                <div class="stats-card card h-100 text-center py-3 types">
                                    <div class="card-body">
                                        <h3 class="card-title mb-2"><span id="wrong-count">0</span></h3>
                                        <h6 class="card-subtitle mb-0">Faux</h6>
                                    </div>
                                </div>
                            </div>
                        </div>

                  

                         <div id="phrase" class="text-tertiary p-4 rounded mb-4 mt-4 border-black" style="min-height: 100px; font-size: 1.2rem;"></div>

                         <div class="mb-4">
                            <input type="text" id="typing-input" class="form-control form-control-lg typing-input" placeholder="Start typing..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        </div>

                         <div class="text-center">
                            <button id="restart-btn" onclick="resetGame()" class="btn btn-primary btn-lg px-4">
                                <i class="fas fa-redo me-2"></i>Restart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

  
    </footer>

    <script src="/assets/script/typing.js">
       
    </script>
</body>
</html>
